<h1>HTML 嵌入 · PowerPoint 插件</h1>
<p>把本地 HTML 嵌入幻灯片，HTML 会保存进 .pptx 文件，放映时可以交互。</p>
<ol>
<li>下载 <a href="manifest.xml" download>manifest.xml</a> 和 <a href="install-mac.sh" download>install-mac.sh</a>，放在同一个文件夹，在终端里运行 <code>bash install-mac.sh</code>。</li>
<li>完全退出 PowerPoint 后重新打开：插入 → 加载项 → 我的加载项 → HTML 嵌入。</li>
<li>在插入的框里选择 HTML 文件或文件夹。</li>
</ol>
<p>联网打开过一次后，插件会缓存在本机，离线时也能使用。</p>
</body></html>
